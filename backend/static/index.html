<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BLACKBOX — Investigation Console</title>
<style>
  :root {
    color-scheme: dark;
    --surface-0: #141413;
    --surface-1: #1a1a19;
    --surface-2: #232321;
    --surface-3: #2c2c29;
    --border:    #3a3a37;
    --text-1:    #f0efec;
    --text-2:    #c3c2b7;
    --text-muted:#8a897f;
    --accent:    #c96442;
    --process:   #3987e5;
    --http:      #d95926;
    --network:   #199e70;
    --edge-parent:  #8a897f;
    --edge-spawned: #e66767;
    --edge-network: #9085e9;
    --c-high:   #2fa36b;
    --c-medium: #d99a26;
    --c-low:    #8a897f;
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --surface-0: #f5f5f3;
    --surface-1: #fcfcfb;
    --surface-2: #eeeeea;
    --surface-3: #e5e4de;
    --border:    #d6d5cf;
    --text-1:    #16150f;
    --text-2:    #52514e;
    --text-muted:#86857c;
    --accent:    #b24a2b;
    --process:   #2a78d6;
    --http:      #eb6834;
    --network:   #1baf7a;
    --edge-parent:  #86857c;
    --edge-spawned: #e34948;
    --edge-network: #6250d6;
    --c-high:   #1f8a57;
    --c-medium: #b57d12;
    --c-low:    #86857c;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; margin: 0; }
  body {
    font: 14px/1.5 ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    background: var(--surface-0); color: var(--text-1);
    display: grid; grid-template-rows: auto 1fr; height: 100vh; overflow: hidden;
  }
  /* ---------- header ---------- */
  header {
    display: flex; align-items: center; gap: 12px;
    padding: 10px 16px; background: var(--surface-1);
    border-bottom: 1px solid var(--border); flex-wrap: wrap;
  }
  header h1 { font-size: 14px; font-weight: 700; margin: 0; letter-spacing: 0.1em; }
  header h1 b { color: var(--accent); }
  header h1 span { color: var(--text-muted); font-weight: 400; letter-spacing: .04em; }
  select, button {
    font: inherit; background: var(--surface-2); color: var(--text-1);
    border: 1px solid var(--border); border-radius: 6px; padding: 5px 9px; cursor: pointer;
  }
  label.ctl { display: inline-flex; align-items: center; gap: 6px; color: var(--text-2); font-size: 13px; }
  button:hover, select:hover { border-color: var(--text-muted); }
  .spacer { flex: 1; }
  .verdict {
    display: inline-flex; align-items: center; gap: 10px;
    background: var(--surface-2); border: 1px solid var(--border);
    border-radius: 999px; padding: 4px 6px 4px 12px; font-size: 13px;
  }
  .verdict .label { color: var(--text-muted); }
  .verdict .pill {
    font-weight: 700; font-size: 12px; text-transform: uppercase;
    letter-spacing: .05em; padding: 3px 10px; border-radius: 999px; color: #fff;
  }
  .verdict .pill[data-c="high"]   { background: var(--c-high); }
  .verdict .pill[data-c="medium"] { background: var(--c-medium); }
  .verdict .pill[data-c="low"]    { background: var(--c-low); }
  .verdict .pill[data-c="none"]   { background: var(--text-muted); }
  .verdict .counts { color: var(--text-2); font-variant-numeric: tabular-nums; }
  .integrity { display: inline-flex; align-items: center; gap: 7px; font-size: 12.5px;
    padding: 4px 11px; border-radius: 999px; border: 1px solid var(--border);
    background: color-mix(in srgb, var(--c-high) 14%, var(--surface-2)); }
  .integrity.broken { background: color-mix(in srgb, var(--edge-spawned) 20%, var(--surface-2));
    border-color: var(--edge-spawned); }
  .integrity .itext { color: var(--text-2); }
  .integrity .itext b { color: var(--text-1); }
  .integrity .itext code { font-family: ui-monospace, Menlo, monospace; font-size: 11px; color: var(--text-muted); }
  /* center view switch */
  .viewswitch { display: inline-flex; border: 1px solid var(--border); border-radius: 7px; overflow: hidden; }
  .viewswitch button { border: 0; border-radius: 0; padding: 5px 11px; background: var(--surface-2);
    color: var(--text-muted); font-size: 12px; font-weight: 650; }
  .viewswitch button.on { background: var(--accent); color: #fff; }
  /* segmented language switch */
  .lang { display: inline-flex; border: 1px solid var(--border); border-radius: 7px; overflow: hidden; }
  .lang button { border: 0; border-radius: 0; padding: 5px 9px; background: var(--surface-2);
    color: var(--text-muted); font-size: 12px; font-weight: 700; letter-spacing: .03em; }
  .lang button.on { background: var(--accent); color: #fff; }
  .iconbtn { padding: 5px 8px; line-height: 1; }
  .navlink { font: inherit; font-size: 13px; text-decoration: none; color: var(--text-1);
    background: var(--surface-2); border: 1px solid var(--border); border-radius: 6px;
    padding: 5px 11px; }
  .navlink:hover { border-color: var(--text-muted); }

  /* ---------- layout ---------- */
  .console {
    display: grid; grid-template-columns: 340px 1fr 380px; min-height: 0;
    transition: grid-template-columns .18s ease;
  }
  .console.hide-left  { grid-template-columns: 0 1fr 380px; }
  .console.hide-right { grid-template-columns: 340px 1fr 0; }
  .console.hide-left.hide-right { grid-template-columns: 0 1fr 0; }
  .col { min-height: 0; min-width: 0; display: flex; flex-direction: column; overflow: hidden; }
  .col.narrative { border-right: 1px solid var(--border); background: var(--surface-1); }
  .col.evidence  { border-left: 1px solid var(--border); background: var(--surface-1); }
  .col-head {
    padding: 10px 12px 9px 16px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 8px; white-space: nowrap;
  }
  .col-head h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .09em;
    color: var(--text-muted); margin: 0; font-weight: 700; }
  .col-head .hint { color: var(--text-muted); font-size: 11px; }
  .col-head .collapse { padding: 2px 7px; color: var(--text-muted); font-size: 13px; }
  .col-body { overflow: auto; padding: 12px; flex: 1; }

  /* reopen handles when a column is hidden */
  .reopen {
    position: fixed; top: 50%; transform: translateY(-50%); z-index: 20;
    background: var(--surface-2); color: var(--text-2); border: 1px solid var(--border);
    padding: 14px 5px; font-size: 13px; font-weight: 700;
  }
  .reopen.left  { left: 0;  border-left: 0;  border-radius: 0 9px 9px 0; }
  .reopen.right { right: 0; border-right: 0; border-radius: 9px 0 0 9px; }

  /* ---------- narrative cards ---------- */
  .story { display: flex; flex-direction: column; position: relative; }
  .stage { position: relative; padding: 12px 12px 14px 40px; cursor: pointer;
    border-radius: 10px; border: 1px solid transparent; }
  .stage:hover { background: var(--surface-2); }
  .stage.active { background: var(--surface-2); border-color: var(--border); }
  .stage::before { content: ""; position: absolute; left: 18px; top: 26px; bottom: -6px;
    width: 2px; background: var(--border); }
  .stage:last-child::before { display: none; }
  .stage .dot { position: absolute; left: 11px; top: 14px; width: 16px; height: 16px;
    border-radius: 50%; background: var(--surface-0); border: 3px solid var(--accent); z-index: 1; }
  .stage.active .dot { box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 25%, transparent); }
  .stage .top { display: flex; align-items: center; gap: 8px; margin-bottom: 3px; }
  .stage .tactic { font-size: 10px; text-transform: uppercase; letter-spacing: .06em;
    color: var(--text-muted); font-weight: 700; }
  .stage .conf { margin-left: auto; font-size: 10px; font-weight: 700; text-transform: uppercase;
    letter-spacing: .04em; padding: 2px 7px; border-radius: 999px; color: #fff; }
  .conf[data-c="high"]   { background: var(--c-high); }
  .conf[data-c="medium"] { background: var(--c-medium); }
  .conf[data-c="low"]    { background: var(--c-low); }
  .stage .title { font-size: 14px; font-weight: 650; margin: 1px 0 5px; }
  .stage .tech { font-size: 12px; color: var(--text-2); display: inline-flex; align-items: center; gap: 6px; }
  .stage .tech code { font-family: ui-monospace, Menlo, monospace; font-size: 11px;
    background: var(--surface-3); padding: 1px 5px; border-radius: 4px; color: var(--text-1); }
  .stage .foot { margin-top: 7px; display: flex; gap: 12px;
    color: var(--text-muted); font-size: 11px; font-variant-numeric: tabular-nums; }

  /* ---------- graph ---------- */
  .col.graph { position: relative; }
  #cy { position: absolute; inset: 0; }
  .graph-toolbar { position: absolute; top: 10px; left: 10px; z-index: 5;
    display: flex; gap: 6px; align-items: center; }
  .legend { position: absolute; left: 10px; bottom: 10px; z-index: 5;
    background: color-mix(in srgb, var(--surface-1) 92%, transparent);
    border: 1px solid var(--border); border-radius: 8px; padding: 9px 11px;
    font-size: 11.5px; display: grid; gap: 6px; backdrop-filter: blur(4px); }
  .legend h3 { font-size: 10px; text-transform: uppercase; letter-spacing: .08em;
    color: var(--text-muted); margin: 0 0 1px; font-weight: 700; }
  .legend .row { display: flex; align-items: center; gap: 8px; cursor: pointer; }
  .legend .row.off { opacity: .35; }
  .swatch { width: 13px; height: 13px; border-radius: 3px; flex: none; }
  .swatch.process { background: var(--process); }
  .swatch.http    { background: var(--http); transform: rotate(45deg); border-radius: 2px; }
  .swatch.network { background: var(--network); border-radius: 50%; }
  .line { width: 17px; height: 0; flex: none; border-top-width: 3px; border-top-style: solid; }
  .line.parent  { border-color: var(--edge-parent); border-top-style: dashed; }
  .line.spawned { border-color: var(--edge-spawned); }
  .line.network { border-color: var(--edge-network); }
  .graph-empty { position: absolute; inset: 0; display: grid; place-items: center;
    color: var(--text-muted); text-align: center; padding: 24px; }

  /* ---------- infrastructure map + impact ---------- */
  #infra { position: absolute; inset: 0; }
  .impact-banner { position: absolute; top: 54px; left: 10px; right: 10px; z-index: 6;
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
    background: color-mix(in srgb, var(--surface-1) 93%, transparent);
    border: 1px solid var(--border); border-radius: 10px; padding: 9px 14px;
    backdrop-filter: blur(5px); }
  .impact-banner .sev { font-weight: 800; font-size: 12px; text-transform: uppercase;
    letter-spacing: .06em; padding: 4px 11px; border-radius: 999px; color: #fff; }
  .sev[data-s="critical"] { background: #c0392b; }
  .sev[data-s="high"]     { background: var(--edge-spawned); }
  .sev[data-s="medium"]   { background: var(--c-medium); }
  .sev[data-s="low"]      { background: var(--c-low); }
  .impact-banner .fact { font-size: 13px; color: var(--text-2); }
  .impact-banner .fact b { color: var(--text-1); }
  .impact-banner .fact.hit b { color: var(--edge-spawned); }
  /* live toggle */
  .ctl.live { position: relative; }
  .livedot { width: 8px; height: 8px; border-radius: 50%; background: var(--text-muted); display: inline-block; }
  #live:checked ~ .livedot { background: #e0484a; animation: pulse 1.1s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.25} }
  /* infra legend swatches reuse .legend; asset status colors */
  .asset-legend .s { width: 12px; height: 12px; border-radius: 3px; display:inline-block; }
  .s.normal { background: var(--c-high); } .s.touched { background: var(--c-medium); }
  .s.compromised { background: var(--edge-spawned); }
  /* rules view */
  .rules { position: absolute; inset: 0; overflow: auto; padding: 54px 18px 18px; }
  .rulecard { border: 1px solid var(--border); border-radius: 10px; background: var(--surface-1);
    margin-bottom: 12px; overflow: hidden; }
  .rulecard .rh { display: flex; align-items: center; gap: 9px; padding: 9px 13px;
    background: var(--surface-2); border-bottom: 1px solid var(--border); flex-wrap: wrap; }
  .rulecard .rh .fmt { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em;
    padding: 2px 7px; border-radius: 5px; color: #fff; }
  .fmt.sigma { background: var(--process); } .fmt.tetragon { background: var(--network); }
  .rulecard .rh .rt { font-weight: 650; font-size: 13.5px; }
  .rulecard .rh code { font-family: ui-monospace, Menlo, monospace; font-size: 11px;
    background: var(--surface-3); padding: 1px 5px; border-radius: 4px; }
  .rulecard .rh .enf { color: #fff; background: var(--edge-spawned); font-size: 10px; font-weight: 700;
    padding: 2px 7px; border-radius: 999px; text-transform: uppercase; letter-spacing: .04em; }
  .rulecard .rh .copy { margin-left: auto; font-size: 11px; padding: 3px 9px; }
  .rulecard pre { margin: 0; padding: 11px 13px; font-family: ui-monospace, Menlo, monospace;
    font-size: 11.5px; line-height: 1.45; white-space: pre-wrap; word-break: break-word;
    color: var(--text-2); background: var(--surface-0); }
  .enforce-panel { border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px;
    margin-bottom: 14px; background: var(--surface-1); display: flex; align-items: center;
    gap: 12px; flex-wrap: wrap; }
  .enforce-panel.armed { border-color: var(--edge-spawned);
    background: color-mix(in srgb, var(--edge-spawned) 10%, var(--surface-1)); }
  .enforce-panel .et { font-weight: 700; font-size: 13px; }
  .enforce-panel .st { font-size: 11px; font-weight: 700; text-transform: uppercase;
    letter-spacing: .04em; padding: 3px 9px; border-radius: 999px; }
  .st.off { background: var(--surface-3); color: var(--text-muted); }
  .st.on { background: var(--edge-spawned); color: #fff; }
  .enforce-panel .bins { font-family: ui-monospace, Menlo, monospace; font-size: 12px; color: var(--text-2); }
  .enforce-panel .spacer { flex: 1; }
  .enforce-panel button { padding: 6px 13px; font-weight: 650; }
  .enforce-panel button.arm { background: var(--edge-spawned); border-color: var(--edge-spawned); color: #fff; }
  .enforce-panel .note { flex-basis: 100%; font-size: 11.5px; color: var(--text-muted); }

  /* ---------- timeline ---------- */
  .timeline { position: absolute; inset: 0; overflow: auto; padding: 54px 18px 18px; }
  .tl-row { display: grid; grid-template-columns: 64px 118px 1fr auto; gap: 12px;
    align-items: baseline; padding: 7px 12px; border-radius: 8px; cursor: pointer;
    border: 1px solid transparent; position: relative; }
  .tl-row:hover { background: var(--surface-2); }
  .tl-row.active { background: var(--surface-2); border-color: var(--border); }
  .tl-row.instage { border-left: 3px solid var(--border); }
  .tl-row.instage[data-c="high"]   { border-left-color: var(--c-high); }
  .tl-row.instage[data-c="medium"] { border-left-color: var(--c-medium); }
  .tl-row.instage[data-c="low"]    { border-left-color: var(--c-low); }
  .tl-row.dim { opacity: .4; }
  .tl-time { color: var(--text-muted); font-variant-numeric: tabular-nums; font-size: 12px; }
  .tl-type { font-size: 10px; text-transform: uppercase; letter-spacing: .05em; font-weight: 700;
    padding: 2px 7px; border-radius: 5px; align-self: center; text-align: center; }
  .tl-type[data-k="process"]        { color: var(--process); background: color-mix(in srgb, var(--process) 16%, transparent); }
  .tl-type[data-k="http_request"]   { color: var(--http);    background: color-mix(in srgb, var(--http) 16%, transparent); }
  .tl-type[data-k="network_connection"] { color: var(--network); background: color-mix(in srgb, var(--network) 16%, transparent); }
  .tl-label { font-size: 13px; word-break: break-word; }
  .tl-label .stage-tags { margin-left: 8px; }
  .tl-tag { display: inline-block; font-size: 10px; font-weight: 700; padding: 1px 6px;
    border-radius: 999px; color: #fff; margin-left: 4px; vertical-align: middle; }
  .tl-tag[data-c="high"] { background: var(--c-high); }
  .tl-tag[data-c="medium"] { background: var(--c-medium); }
  .tl-tag[data-c="low"] { background: var(--c-low); }
  .tl-hash { font-family: ui-monospace, Menlo, monospace; font-size: 11px; color: var(--text-muted); }

  /* ---------- evidence panel ---------- */
  .ev-kind { font-size: 10px; text-transform: uppercase; letter-spacing: .08em;
    font-weight: 700; color: var(--text-muted); }
  .ev-title { font-size: 16px; font-weight: 650; margin: 3px 0 10px; word-break: break-word; }
  .ev-section { margin-bottom: 14px; }
  .ev-section h4 { font-size: 10px; text-transform: uppercase; letter-spacing: .07em;
    color: var(--text-muted); margin: 0 0 6px; font-weight: 700; }
  .badges { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
  .badge { font-size: 11px; padding: 3px 8px; border-radius: 6px;
    background: var(--surface-2); border: 1px solid var(--border); color: var(--text-2); }
  .badge code { font-family: ui-monospace, Menlo, monospace; color: var(--text-1); }
  .prose { font-size: 13px; color: var(--text-2); }
  .reason { font-size: 12.5px; color: var(--text-2); background: var(--surface-2);
    border-left: 2px solid var(--accent); border-radius: 0 6px 6px 0; padding: 8px 10px; }
  dl.kv { display: grid; grid-template-columns: auto 1fr; gap: 3px 12px; margin: 0; }
  dl.kv dt { color: var(--text-muted); white-space: nowrap; }
  dl.kv dd { margin: 0; word-break: break-word; }
  dl.kv dd.mono { font-family: ui-monospace, Menlo, monospace; font-size: 12px; }
  .ev-list { display: flex; flex-direction: column; gap: 5px; }
  .ev-item { display: grid; grid-template-columns: auto 1fr auto; gap: 8px; align-items: baseline;
    padding: 7px 9px; border: 1px solid var(--border); border-radius: 7px;
    background: var(--surface-2); cursor: pointer; font-size: 12.5px; }
  .ev-item:hover { border-color: var(--text-muted); }
  .ev-item.ingraph { border-left: 3px solid var(--accent); }
  .ev-item .t { color: var(--text-muted); font-variant-numeric: tabular-nums; font-size: 11px; }
  .ev-item .d { word-break: break-word; }
  .ev-item .d b { font-weight: 650; }
  .ev-item .tag { font-size: 10px; color: var(--text-muted); text-transform: uppercase; letter-spacing: .04em; }
  .ev-more { color: var(--text-muted); font-size: 12px; padding: 4px 2px; }
  .placeholder { color: var(--text-muted); font-size: 13px; padding: 20px 4px; text-align: center; }
</style>
</head>
<body>
<header>
  <h1><b>BLACKBOX</b> <span data-i18n="subtitle"></span></h1>
  <label class="ctl"><span data-i18n="case"></span>
    <select id="scenario"></select>
  </label>
  <div class="verdict" id="verdict" hidden>
    <span class="label" data-i18n="reconstruction"></span>
    <span class="pill" id="verdictPill" data-c="none">—</span>
    <span class="counts" id="verdictCounts"></span>
  </div>
  <div class="integrity" id="integrity" hidden title="">
    <span class="lock" id="integrityLock">🔒</span>
    <span class="itext" id="integrityText"></span>
  </div>
  <div class="spacer"></div>
  <label class="ctl"><input type="checkbox" id="focus" checked> <span data-i18n="focus"></span></label>
  <select id="layout">
    <option value="breadthfirst" data-i18n="layout_hierarchy"></option>
    <option value="cose" data-i18n="layout_force"></option>
  </select>
  <div class="lang" id="lang">
    <button data-lang="ru">RU</button>
    <button data-lang="en">EN</button>
    <button data-lang="kz">KZ</button>
  </div>
  <a href="/ui/targets.html" class="navlink" data-i18n="nav_targets"></a>
  <a href="#" id="reportLink" class="navlink" target="_blank" data-i18n="nav_report"></a>
  <button id="theme" class="iconbtn" title="Theme">◐</button>
</header>

<button class="reopen left"  id="reopenLeft"  hidden>›</button>
<button class="reopen right" id="reopenRight" hidden>‹</button>

<div class="console" id="console">
  <!-- NARRATIVE -->
  <section class="col narrative">
    <div class="col-head">
      <h2 data-i18n="attack_story"></h2>
      <span class="hint" id="storyHint"></span>
      <span class="spacer"></span>
      <button class="collapse" id="collapseLeft" title="Hide">«</button>
    </div>
    <div class="col-body"><div class="story" id="story"></div></div>
  </section>

  <!-- GRAPH -->
  <section class="col graph">
    <div id="cy"></div>
    <div class="timeline" id="timeline" hidden></div>
    <div id="infra" hidden></div>
    <div class="rules" id="rules" hidden></div>
    <div class="impact-banner" id="impactBanner" hidden></div>
    <div class="graph-empty" id="graphEmpty">…</div>
    <div class="graph-toolbar">
      <div class="viewswitch" id="viewswitch">
        <button data-view="infra" class="on" data-i18n="view_infra"></button>
        <button data-view="graph" data-i18n="view_graph"></button>
        <button data-view="timeline" data-i18n="view_timeline"></button>
        <button data-view="rules" data-i18n="view_rules"></button>
      </div>
      <label class="ctl live" title="Auto-refresh while attacking">
        <input type="checkbox" id="live"> <span class="livedot"></span><span data-i18n="live"></span>
      </label>
      <button id="fit" data-i18n="fit"></button>
      <button id="clearSel" data-i18n="clear_sel"></button>
    </div>
    <div class="legend">
      <h3 data-i18n="nodes"></h3>
      <div class="row" data-node="process"><span class="swatch process"></span> <span data-i18n="n_process"></span></div>
      <div class="row" data-node="http_request"><span class="swatch http"></span> <span data-i18n="n_http"></span></div>

function escapeHtml(s) {

/* ---------- data ---------- */
async function loadScenarios() {
  const list = await (await fetch('/scenarios')).json();
  const sel = $('#scenario'); sel.innerHTML = '';
  for (const s of list) {
    const o = document.createElement('option');
    o.value = s.scenario_id; o.textContent = `${s.scenario_id} · ${s.event_count}`;
    sel.appendChild(o);
  }
  // optional ?case=<scenario> preselect (used by the target loader)
  const want = new URLSearchParams(location.search).get('case');
  if (want && list.some((s) => s.scenario_id === want)) sel.value = want;
  return list.length > 0;
}
async function loadCase() {
  const sid = $('#scenario').value; if (!sid) return;
  activeStage = null; activeNode = null;
  const [g, r, tl, integ, inf, imp, rul, enf] = await Promise.all([
    fetch(`/incidents/${encodeURIComponent(sid)}/graph`).then(x => x.ok ? x.json() : null),
    fetch(`/incidents/${encodeURIComponent(sid)}/reconstruction`).then(x => x.ok ? x.json() : null),
    fetch(`/incidents/${encodeURIComponent(sid)}/timeline`).then(x => x.ok ? x.json() : null),
    fetch('/integrity').then(x => x.ok ? x.json() : null),
    fetch(`/incidents/${encodeURIComponent(sid)}/infrastructure`).then(x => x.ok ? x.json() : null),
    fetch(`/incidents/${encodeURIComponent(sid)}/impact`).then(x => x.ok ? x.json() : null),
    fetch(`/incidents/${encodeURIComponent(sid)}/rules`).then(x => x.ok ? x.json() : null),
    fetch(`/incidents/${encodeURIComponent(sid)}/enforce`).then(x => x.ok ? x.json() : null),
  ]);
  enforceData = enf;
  graph = g; recon = r; timeline = tl; integrityData = integ; infra = inf; impactData = imp; rulesData = rul; nodeById = {};
  if (g) g.nodes.forEach((n) => nodeById[n.id] = n);
  renderVerdict(); renderIntegrity(); renderStory(); renderGraph(); renderTimeline();
  renderInfra(); renderImpact(); renderRules(); updateReportLink(); resetEvidence();

}

  v.hidden = false;

  pill.textContent = c === 'none' ? t('inconclusive') : t('conf_' + c);
  $('#verdictCounts').textContent = t('counts', { s: recon.stage_count, e: recon.event_count });
}

/* ---------- integrity badge ---------- */
function renderIntegrity() {
  const el = $('#integrity');
  if (!integrityData) { el.hidden = true; return; }
  el.hidden = false;
  const ok = integrityData.ok;
  el.classList.toggle('broken', !ok);
  $('#integrityLock').textContent = ok ? '🔒' : '⚠';
  const head = (integrityData.head || '').slice(0, 10);
  $('#integrityText').innerHTML = ok
    ? `${escapeHtml(t('integrity'))}: <b>${escapeHtml(t('integrity_verified'))}</b> · ${integrityData.count} · <code>${escapeHtml(head)}…</code>`
    : `${escapeHtml(t('integrity'))}: <b>${escapeHtml(t('integrity_broken'))}</b>`;
  el.title = ok ? `${t('integrity_head')}: ${integrityData.head}` : (integrityData.reason || '');
}

/* ---------- timeline ---------- */
function renderTimeline() {
  const box = $('#timeline');
  if (!timeline) { box.innerHTML = ''; return; }
  const typeLabel = { process_created: t('n_process'), http_request: t('n_http'), network_connection: t('n_network') };
  box.innerHTML = timeline.entries.map((e) => {
    const topStage = e.stages.length ? e.stages.reduce((a, b) =>
      CONF_RANK[b.confidence] > CONF_RANK[a.confidence] ? b : a) : null;
    const tags = e.stages.map((s) =>
      `<span class="tl-tag" data-c="${s.confidence}">${s.order}</span>`).join('');
    const tl = (typeLabel[e.event_type] || e.event_type);
    return `<div class="tl-row ${topStage ? 'instage' : ''}" ${topStage ? `data-c="${topStage.confidence}"` : ''} data-id="${escapeHtml(e.event_id)}" data-stages="${e.stages.map(s=>s.key).join(' ')}">
      <span class="tl-time">${clock(e.timestamp)}</span>
      <span class="tl-type" data-k="${e.event_type}">${escapeHtml(tl)}</span>
      <span class="tl-label">${escapeHtml(e.label)}<span class="stage-tags">${tags}</span></span>
      <span class="tl-hash" title="${escapeHtml(e.chain_hash || '')}">${escapeHtml((e.chain_hash||'').slice(0,8))}</span>
    </div>`;

      box.querySelectorAll('.tl-row').forEach((r) => r.classList.remove('active'));

}
const CONF_RANK = { low: 0, medium: 1, high: 2 };

function markTimelineStage(key) {
  const rows = $('#timeline').querySelectorAll('.tl-row');

  cyInfra = cytoscape({ container: $('#infra'), elements, style: buildInfraStyle(),
    layout: { name: 'breadthfirst', directed: true, spacingFactor: 1.9, padding: 60,
              animate: true, animationDuration: 300 },
    wheelSensitivity: 0.2, minZoom: 0.2, maxZoom: 1.25 });
  cyInfra.on('tap', 'node', (ev) => showAssetEvidence(ev.target.data()));
  // flash assets that just became compromised (live attack effect)
  infra.assets.forEach((a) => {
    if (prevStatus[a.id] && prevStatus[a.id] !== a.status && a.status === 'compromised') {
      const n = cyInfra.getElementById(a.id);
      n.animate({ style: { 'width': 52, 'height': 52 } }, { duration: 200,
        complete: () => n.animate({ style: { 'width': 34, 'height': 34 } }, { duration: 350 }) });
    }
  });
  prevStatus = newStatus;
}
function renderImpact() {
  const b = $('#impactBanner');
  if (!impactData || view !== 'infra') { b.hidden = true; return; }
  b.hidden = false;
  const i = impactData, facts = [];
  if (i.code_execution) facts.push(`<span class="fact hit"><b>${escapeHtml(t('imp_rce'))}</b></span>`);
  if (i.root_achieved) facts.push(`<span class="fact hit"><b>${escapeHtml(t('imp_root'))}</b></span>`);
  if (i.secret_count) facts.push(`<span class="fact hit">${escapeHtml(t('imp_secrets', {n: i.secret_count}))}</span>`);
  if (i.egress_attempts && i.egress_attempts.length)
    facts.push(`<span class="fact">${escapeHtml(t('imp_egress', {n: i.egress_attempts.length}))}</span>`);
  if (!facts.length) facts.push(`<span class="fact">${escapeHtml(t('imp_clean'))}</span>`);
  b.innerHTML = `<span class="sev" data-s="${escapeHtml(i.severity)}">${escapeHtml(i.severity)}</span>` + facts.join('');
}
function showAssetEvidence(a) {
  $('#evHead').textContent = t('evidence');
  const tech = (a.techniques || []).map((x) => `<span class="badge"><code>${escapeHtml(x)}</code></span>`).join(' ');
  const ev = (a.evidence || []).slice(0, 30).map(evItemHtml).join('');
  $('#evBody').innerHTML = `
    <div class="ev-kind">${escapeHtml(a.type)} · ${escapeHtml(t('a_' + a.status))}</div>
    <div class="ev-title">${escapeHtml(a.label)}</div>
    ${tech ? `<div class="badges">${tech}</div>` : ''}
    ${ev ? `<div class="ev-section"><h4>${escapeHtml(t('backing_events'))}</h4><div class="ev-list">${ev}</div></div>` : ''}`;
  wireEvItems();
}

/* ---------- defences (rules) ---------- */
function enforcePanelHtml() {
  const e = enforceData;
  if (!e) return '';
  const armed = !!e.armed;
  const bins = (e.blockable || []).map(escapeHtml).join(', ');
  const canArm = (e.blockable || []).length > 0 && e.sensor;
  return `<div class="enforce-panel ${armed ? 'armed' : ''}">
    <span class="et">${escapeHtml(t('enf_title'))}</span>
    <span class="st ${armed ? 'on' : 'off'}">${escapeHtml(armed ? t('enf_active') : t('enf_inactive'))}</span>
    ${bins ? `<span class="bins">${bins}</span>` : `<span class="bins">${escapeHtml(t('enf_none'))}</span>`}
    <span class="spacer"></span>
    ${armed
      ? `<button id="disarmBtn">${escapeHtml(t('enf_disarm'))}</button>`
      : `<button class="arm" id="armBtn" ${canArm ? '' : 'disabled'}>${escapeHtml(t('enf_arm'))}</button>`}
    <span class="note">🛡 ${escapeHtml(t('enf_safety'))}</span>
  </div>`;
}
async function refreshEnforce() {
  const sid = $('#scenario').value; if (!sid) return;
  enforceData = await fetch(`/incidents/${encodeURIComponent(sid)}/enforce`).then(x => x.ok ? x.json() : null);
  renderRules();
}
async function enforceAction(method) {
  const sid = $('#scenario').value; if (!sid) return;
  const btn = $(method === 'POST' ? '#armBtn' : '#disarmBtn');
  if (btn) { btn.disabled = true; btn.textContent = '…'; }
  try {
    const res = await fetch(`/incidents/${encodeURIComponent(sid)}/enforce`, { method });
    if (!res.ok) { const d = await res.json().catch(() => ({})); throw new Error(d.detail || res.status); }
  } catch (e) { alert(e.message); }
  await refreshEnforce();
}
function renderRules() {
  const box = $('#rules');
  const panel = enforcePanelHtml();
  if (!rulesData || !rulesData.rules.length) {
    box.innerHTML = panel + `<div class="placeholder">${escapeHtml(t('rules_none'))}</div>`;
    wireEnforce(); return;
  }
  box.innerHTML = panel + rulesData.rules.map((r, i) => `
    <div class="rulecard">
      <div class="rh">
        <span class="fmt ${r.format}">${escapeHtml(r.format)}</span>
        <span class="rt">${escapeHtml(r.title)}</span>
        <code>${escapeHtml(r.technique)}</code>
        ${r.enforces ? `<span class="enf">${escapeHtml(t('rules_enforce'))}</span>` : ''}
        <button class="copy" data-i="${i}">${escapeHtml(t('copy'))}</button>
      </div>
      <pre id="rl${i}">${escapeHtml(r.yaml)}</pre>
    </div>`).join('');
  box.querySelectorAll('.copy').forEach((b) => b.addEventListener('click', () => {
    const txt = rulesData.rules[+b.dataset.i].yaml;
    navigator.clipboard && navigator.clipboard.writeText(txt);
    b.textContent = t('copied'); setTimeout(() => b.textContent = t('copy'), 1200);
  }));
  wireEnforce();
}
function wireEnforce() {
  const a = document.getElementById('armBtn'), d = document.getElementById('disarmBtn');
  if (a) a.addEventListener('click', () => enforceAction('POST'));
  if (d) d.addEventListener('click', () => enforceAction('DELETE'));
}
function updateReportLink() {
  const sid = $('#scenario').value;
  $('#reportLink').href = sid
    ? `/incidents/${encodeURIComponent(sid)}/report?lang=${lang}` : '#';
}

/* ---------- view switch ---------- */
function setView(v) {
  view = v;
  $('#cy').hidden = v !== 'graph';
  $('#timeline').hidden = v !== 'timeline';
  $('#infra').hidden = v !== 'infra';
  $('#rules').hidden = v !== 'rules';
  document.querySelector('.legend').style.display = v === 'graph' ? '' : 'none';
  $('#fit').style.display = (v === 'graph' || v === 'infra') ? '' : 'none';
  document.querySelectorAll('#viewswitch button').forEach((b) => b.classList.toggle('on', b.dataset.view === v));
  updateGraphEmpty();
  renderImpact();
  if (v === 'graph' && cy) { cy.resize(); cy.fit(undefined, 40); if (activeStage) highlightStage(activeStage); }
  if (v === 'infra' && cyInfra) { cyInfra.resize(); cyInfra.fit(undefined, 50); }
  if (v === 'timeline' && activeStage) markTimelineStage(activeStage);
}

/* ---------- narrative ---------- */
function renderStory() {
  const box = $('#story'); box.innerHTML = '';
  if (!recon || !recon.stages.length) {
    box.innerHTML = `<div class="placeholder">${escapeHtml(t('no_stages'))}</div>`;
    $('#storyHint').textContent = ''; return;
  }
  $('#storyHint').textContent = t('stages_n', { n: recon.stages.length });
  for (const s of recon.stages) {
    const el = document.createElement('div');
    el.className = 'stage' + (s.key === activeStage ? ' active' : '');
    el.dataset.key = s.key;
    el.innerHTML = `
      <span class="dot"></span>
      <div class="top">
        <span class="tactic">${escapeHtml(L(s.tactic))}</span>
        <span class="conf" data-c="${s.confidence}">${escapeHtml(t('conf_' + s.confidence).split(' ')[0])}</span>
      </div>
      <div class="title">${s.order}. ${escapeHtml(L(s.title))}</div>
      <div class="tech"><code>${escapeHtml(s.technique_id)}</code> ${escapeHtml(s.technique)}</div>
      <div class="foot">
        <span>${escapeHtml(clock(s.time))}</span>
        <span>${s.evidence.length} ev.</span>
      </div>`;
    el.addEventListener('click', () => selectStage(s.key));
    box.appendChild(el);
  }
}

/* ---------- graph ---------- */
let graphEmptyMsg = null;
function updateGraphEmpty() {
  const show = view === 'graph' && graphEmptyMsg;
  const el = $('#graphEmpty');
  el.style.display = show ? 'grid' : 'none';
  if (show) el.textContent = graphEmptyMsg;
}
function renderGraph() {
  if (!graph) {
    graphEmptyMsg = t('no_cases'); updateGraphEmpty();
    if (cy) { cy.destroy(); cy = null; } return;
  }
  const connected = new Set();
  graph.edges.forEach((e) => { connected.add(e.source); connected.add(e.target); });
  const focus = $('#focus').checked;
  const nodes = graph.nodes.filter((n) => !focus || n.kind !== 'http_request' || connected.has(n.id));
  // Empty after filtering: usually an HTTP-only case (no process telemetry).
  if (nodes.length === 0) {
    if (cy) { cy.destroy(); cy = null; }
    graphEmptyMsg = graph.nodes.length ? t('graph_empty_hint') : t('no_cases');
    updateGraphEmpty();
    return;
  }
  graphEmptyMsg = null; updateGraphEmpty();
  const elements = [
    ...nodes.map((n) => ({ data: { ...n, short: shortLabel(n) } })),
    ...graph.edges.map((e, i) => ({ data: { id: `e${i}`, ...e } })),
  ];
  if (cy) cy.destroy();
  cy = cytoscape({ container: $('#cy'), elements, style: buildStyle(),
    layout: layoutOpts($('#layout').value), wheelSensitivity: 0.2 });
  cy.on('tap', 'node', (ev) => showNodeEvidence(ev.target.id()));
  cy.on('tap', (ev) => { if (ev.target === cy) clearSelection(); });
  applyEdgeFilter();
  if (activeStage) highlightStage(activeStage);
}
function applyEdgeFilter() { if (cy) cy.edges().forEach((e) => e.toggleClass('hidden', hiddenEdges.has(e.data('kind')))); }
function highlightStage(key) {
  if (!cy || !recon) return;
  const stage = recon.stages.find((s) => s.key === key);
  cy.elements().removeClass('stage-hit faded');
  if (!stage) return;
  const ids = new Set(stage.nodes);
  const hits = cy.nodes().filter((n) => ids.has(n.id()));
  if (hits.length === 0) return;
  cy.elements().addClass('faded');
  hits.removeClass('faded').addClass('stage-hit');
  hits.connectedEdges().forEach((e) => { if (ids.has(e.source().id()) && ids.has(e.target().id())) e.removeClass('faded'); });
  cy.animate({ fit: { eles: hits, padding: 80 } }, { duration: 300 });
}

/* ---------- selection ---------- */
function selectStage(key) {
  activeStage = key; activeNode = null;
  document.querySelectorAll('.stage').forEach((el) => el.classList.toggle('active', el.dataset.key === key));
  highlightStage(key); markTimelineStage(key); showStageEvidence(key);
}
function clearSelection() {
  activeStage = null; activeNode = null;
  document.querySelectorAll('.stage').forEach((el) => el.classList.remove('active'));
  if (cy) cy.elements().removeClass('stage-hit faded');
  clearTimelineStage();
  resetEvidence();
}

/* ---------- evidence ---------- */
function resetEvidence() {
  $('#evHead').textContent = t('evidence');
  $('#evBody').innerHTML = `<div class="placeholder">${escapeHtml(t('select_hint'))}</div>`;
}
function evItemHtml(nid) {
  const n = nodeById[nid];
  if (!n) return `<div class="ev-item" data-id="${escapeHtml(nid)}"><span class="t"></span><span class="d mono">${escapeHtml(nid)}</span><span class="tag">${escapeHtml(t('tag_event'))}</span></div>`;
  const inGraph = cy && cy.getElementById(nid).nonempty();
  const tagMap = { process: t('n_process'), http_request: t('n_http'), network: t('n_network') };
  let desc;
  if (n.kind === 'process') desc = `<b>${escapeHtml(n.label)}</b> <span class="t">pid ${n.pid ?? '?'}</span>`;
  else if (n.kind === 'http_request') desc = `<b>${escapeHtml((n.label||'').split('?')[0])}</b>`;
  else desc = `<b>${escapeHtml(n.label)}</b>`;
  return `<div class="ev-item ${inGraph ? 'ingraph' : ''}" data-id="${escapeHtml(nid)}">
    <span class="t">${clock(n.timestamp)}</span><span class="d">${desc}</span>
    <span class="tag">${escapeHtml(tagMap[n.kind] || n.kind)}</span></div>`;
}
function wireEvItems() {
  $('#evBody').querySelectorAll('.ev-item').forEach((el) => {
    el.addEventListener('click', () => {
      const id = el.dataset.id;
      if (cy && cy.getElementById(id).nonempty()) {
        const n = cy.getElementById(id);
        cy.elements().removeClass('stage-hit'); n.addClass('stage-hit');
        cy.animate({ fit: { eles: n.closedNeighborhood(), padding: 120 } }, { duration: 250 });
      }
    });
  });
}
function showStageEvidence(key) {
  const s = recon.stages.find((x) => x.key === key); if (!s) return;
  $('#evHead').textContent = t('stage_evidence');
  const shown = s.evidence.slice(0, 40); const more = s.evidence.length - shown.length;
  $('#evBody').innerHTML = `
    <div class="ev-kind">${escapeHtml(L(s.tactic))} · ${escapeHtml(t('stage_word'))} ${s.order}</div>
    <div class="ev-title">${escapeHtml(L(s.title))}</div>
    <div class="badges">
      <span class="badge">MITRE <code>${escapeHtml(s.technique_id)}</code></span>
      <span class="badge">${escapeHtml(s.technique)}</span>
      <span class="badge">${escapeHtml(t('confidence'))}: ${escapeHtml(t('conf_' + s.confidence).split(' ')[0])}</span>
    </div>
    <div class="ev-section"><h4>${escapeHtml(t('what_happened'))}</h4><div class="prose">${escapeHtml(L(s.summary))}</div></div>
    <div class="ev-section"><h4>${escapeHtml(t('why_technique'))}</h4><div class="reason">${escapeHtml(L(s.technique_reason))}</div></div>
    <div class="ev-section"><h4>${escapeHtml(t('backing_events'))} (${s.evidence.length})</h4>
      <div class="ev-list">${shown.map(evItemHtml).join('')}</div>
      ${more > 0 ? `<div class="ev-more">${escapeHtml(t('more_events', { n: more }))}</div>` : ''}</div>`;
  wireEvItems();
}
function showNodeEvidence(nid) {
  const n = nodeById[nid]; if (!n) return;
  activeStage = null; activeNode = nid;
  document.querySelectorAll('.stage').forEach((el) => el.classList.remove('active'));
  if (cy) { cy.elements().removeClass('stage-hit faded'); cy.getElementById(nid).addClass('stage-hit'); }
  $('#evHead').textContent = t('node_evidence');
  const tagMap = { process: t('n_process'), http_request: t('n_http'), network: t('n_network') };
  let kv = '';
  if (n.kind === 'process')
    kv = row(t('f_pid'), n.pid) + row(t('f_ppid'), n.parent_pid) + row(t('f_cmd'), n.command_line, true)
       + row(t('f_container'), n.container, true) + row(t('f_time'), n.timestamp, true);
  else if (n.kind === 'http_request')
    kv = row(t('f_status'), n.status) + row(t('f_srcip'), n.source_ip, true)
       + row(t('f_container'), n.container, true) + row(t('f_time'), n.timestamp, true);
  else
    kv = row(t('f_dest'), `${n.destination_ip}:${n.destination_port}`, true) + row(t('f_proto'), n.protocol)
       + row(t('f_frompid'), n.pid) + row(t('f_time'), n.timestamp, true);
  let rel = '';
  if (cy) {
    cy.getElementById(nid).connectedEdges().filter((e) => !e.hasClass('hidden')).forEach((e) => {
      const outgoing = e.source().id() === nid;
      const other = outgoing ? e.target() : e.source();
      rel += `<div class="ev-item" data-id="${escapeHtml(other.id())}">
        <span class="t">${outgoing ? '→' : '←'}</span>
        <span class="d">${escapeHtml(e.data('kind').replace('_',' '))}: ${escapeHtml(other.data('short'))}
          <br><span class="t">${escapeHtml(e.data('reason'))}</span></span><span class="tag"></span></div>`;
    });
  }
  $('#evBody').innerHTML = `
    <div class="ev-kind">${escapeHtml(tagMap[n.kind] || n.kind)}</div>
    <div class="ev-title">${escapeHtml(n.label || n.kind)}</div>
    <div class="ev-section"><dl class="kv">${kv}</dl></div>
    ${rel ? `<div class="ev-section"><h4>${escapeHtml(t('correlated_with'))}</h4><div class="ev-list">${rel}</div></div>` : ''}`;
  wireEvItems();
}
function row(dt, dd, mono) {
  if (dd === null || dd === undefined || dd === '') return '';
  return `<dt>${escapeHtml(dt)}</dt><dd class="${mono?'mono':''}">${escapeHtml(dd)}</dd>`;
}

/* ---------- re-render on language change ---------- */
function rerenderDynamic() {
  renderVerdict(); renderIntegrity(); renderStory(); renderTimeline(); renderImpact();
  renderRules(); updateReportLink();
  if (activeStage) { markTimelineStage(activeStage); showStageEvidence(activeStage); }
  else if (activeNode) showNodeEvidence(activeNode);
  else resetEvidence();
}

/* ---------- live auto-refresh (watch the attack unfold) ---------- */
async function pollLive() {
  const sid = $('#scenario').value; if (!sid) return;
  const [inf, imp, r] = await Promise.all([
    fetch(`/incidents/${encodeURIComponent(sid)}/infrastructure`).then(x => x.ok ? x.json() : null),
    fetch(`/incidents/${encodeURIComponent(sid)}/impact`).then(x => x.ok ? x.json() : null),
    fetch(`/incidents/${encodeURIComponent(sid)}/reconstruction`).then(x => x.ok ? x.json() : null),
  ]);
  if (inf) { infra = inf; renderInfra(); }
  if (imp) { impactData = imp; renderImpact(); }
  if (r) { recon = r; renderVerdict(); renderStory(); }
}
function setLive(on) {
  $('#live').checked = on;
  if (liveTimer) { clearInterval(liveTimer); liveTimer = null; }
  if (on) liveTimer = setInterval(pollLive, 1500);
}

/* ---------- collapse columns ---------- */
function setCollapsed(side, collapsed) {
  const cons = $('#console');
  cons.classList.toggle('hide-' + side, collapsed);
  $(side === 'left' ? '#reopenLeft' : '#reopenRight').hidden = !collapsed;
  localStorage.setItem('bb_hide_' + side, collapsed ? '1' : '0');
  if (cy) setTimeout(() => cy.resize(), 200);
}

/* ---------- wiring ---------- */
document.querySelectorAll('.legend .row[data-edge]').forEach((row) => {
  row.addEventListener('click', () => {
    const k = row.dataset.edge;
    if (hiddenEdges.has(k)) { hiddenEdges.delete(k); row.classList.remove('off'); }
    else { hiddenEdges.add(k); row.classList.add('off'); }
    applyEdgeFilter();
  });
});
$('#scenario').addEventListener('change', loadCase);
$('#layout').addEventListener('change', () => { if (cy) cy.layout(layoutOpts($('#layout').value)).run(); });
$('#focus').addEventListener('change', renderGraph);
$('#fit').addEventListener('click', () => {
  if (view === 'infra' && cyInfra) cyInfra.fit(undefined, 50);
  else if (cy) cy.fit(undefined, 40);
});
$('#live').addEventListener('change', (e) => setLive(e.target.checked));
$('#clearSel').addEventListener('click', clearSelection);
$('#theme').addEventListener('click', () => {
  const r = document.documentElement; r.dataset.theme = r.dataset.theme === 'light' ? 'dark' : 'light';
  if (cy) cy.style(buildStyle());
});
$('#lang').addEventListener('click', (e) => {
  const b = e.target.closest('button[data-lang]'); if (!b) return;
  lang = b.dataset.lang; localStorage.setItem('bb_lang', lang);
  applyI18n(); rerenderDynamic();
});
$('#viewswitch').addEventListener('click', (e) => {
  const b = e.target.closest('button[data-view]'); if (b) setView(b.dataset.view);
});
$('#collapseLeft').addEventListener('click', () => setCollapsed('left', true));
$('#collapseRight').addEventListener('click', () => setCollapsed('right', true));
$('#reopenLeft').addEventListener('click', () => setCollapsed('left', false));
$('#reopenRight').addEventListener('click', () => setCollapsed('right', false));

(async function init() {
  // URL overrides (also handy for deep-links / demos): ?lang=kz&hide=left,right
  const qs = new URLSearchParams(location.search);
  if (I18N[qs.get('lang')]) { lang = qs.get('lang'); localStorage.setItem('bb_lang', lang); }
  const hide = (qs.get('hide') || '').split(',');
  applyI18n();
  setCollapsed('left', hide.includes('left') || localStorage.getItem('bb_hide_left') === '1');
  setCollapsed('right', hide.includes('right') || localStorage.getItem('bb_hide_right') === '1');
  const has = await loadScenarios();
  if (!has) {
    $('#graphEmpty').textContent = t('no_cases'); $('#graphEmpty').style.display = 'grid';
    $('#story').innerHTML = `<div class="placeholder">${escapeHtml(t('no_cases'))}</div>`;
    resetEvidence(); return;
  }
  await loadCase();
  const wantView = qs.get('view');
  setView(['graph', 'timeline', 'infra', 'rules'].includes(wantView) ? wantView : 'infra');
  if (qs.get('live') === '1') setLive(true);
})();
</script>
